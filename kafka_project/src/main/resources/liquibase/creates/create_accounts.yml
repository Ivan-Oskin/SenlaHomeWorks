databaseChangeLog:
  - changeSet:
      id: 1
      author: Ivan
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: balance
                  type: INT
                  constraints:
                    nullable: false