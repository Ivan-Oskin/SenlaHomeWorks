databaseChangeLog:
  - changeSet:
      id: 1
      author: Ivan
      changes:
        - createTable:
            tableName: transfers
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: id_withdrawing
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: id_depositing
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: sum
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(25)
                  constraints:
                    nullable: false