databaseChangeLog:
  - changeSet:
      id: 2
      author: Ivan
      changes:
        - createTable:
            tableName: masters
            columns:
              - column:
                  name: id
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false