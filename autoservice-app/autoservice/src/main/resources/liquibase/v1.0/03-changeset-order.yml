databaseChangeLog:
  - changeSet:
      id: 3
      author: Ivan
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: time_create
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: time_start
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: time_complete
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: cost
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: place_id
                  type: INTEGER