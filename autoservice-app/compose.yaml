services:
  postgres:
    image: postgres:16.8
    ports:
      - "5432:5438"
    environment:
      POSTGRES_USER: carrepair_admin
      POSTGRES_PASSWORD: Admin
      POSTGRES_DB: carrepairdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autoservice-network
  myapp:
    build:
      dockerfile: dockerfile
    container_name: autoservice-app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - autoservice-network
volumes:
  postgres_data:
networks:
  autoservice-network:
    driver: bridge
